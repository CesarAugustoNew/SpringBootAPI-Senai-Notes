spring.application.name=senai-notes-api

server.port=${PORT:8080}

# CORS: domínios liberados a chamar a API, separados por vírgula.
# Ex.: https://senai-notes.vercel.app,http://localhost:4200
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# Banco de dados (PostgreSQL)
# Pode ser sobrescrito por variaveis de ambiente ou por um arquivo .env
# na raiz do projeto (suportado via spring-dotenv), ex:
#   DB_URL=jdbc:postgresql://localhost:5432/senainotes
#   DB_USERNAME=postgres
#   DB_PASSWORD=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/senainotes}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Cesar123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.jakarta.persistence.schema-generation.create-database-schemas=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=notes

# JWT (assinatura HMAC das rotas autenticadas)
jwt.secret=${JWT_SECRET:gPy7aFp_b4E5uX3mG8vK2rD7sW0zJ1cR9pQ4tH6uI-o=}
jwt.issuer=senainotes-api
jwt.expiration-seconds=86400

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
